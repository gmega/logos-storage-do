[defaults]
inventory = inventory.ini
roles_path = roles
host_key_checking = False
retry_files_enabled = False
remote_user = root
private_key_file = ~/.ssh/id_ed25519
stdout_callback = default
# One provisioning log per droplet, named after the host (logos-mp-1 ...),
# written to ../logs (project root) since the playbook runs from ansible/.
callbacks_enabled = community.general.log_plays
timeout = 60
interpreter_python = auto_silent

[callback_log_plays]
log_folder = ../logs

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o ServerAliveInterval=30 -o ServerAliveCountMax=10
