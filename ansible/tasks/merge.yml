---
- name: Merge current inventory bootstrap records
  ansible.builtin.copy:
    content: "{{ groups['mp_nodes'] | map('extract', hostvars, 'tcp_spr') | list | to_nice_json }}\n"
    dest: "{{ playbook_dir }}/../artifacts/tcp-sprs.json"
    mode: "0644"

- name: Write bootstrap records as text
  ansible.builtin.copy:
    content: "{{ groups['mp_nodes'] | map('extract', hostvars, 'tcp_spr') | join('\n') }}\n"
    dest: "{{ playbook_dir }}/../artifacts/tcp-sprs.txt"
    mode: "0644"
