---
# Bootstrap from the MP network; discover service providers dynamically.
- name: "RS Phase 1 — Install precompiled Logos toolchain + storage module"
  hosts: rs_nodes
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Build
      ansible.builtin.import_role:
        name: storage_node
        tasks_from: build

- name: "RS Phase 2 — Configure + start the RS node"
  hosts: rs_nodes
  gather_facts: false
  any_errors_fatal: true
  vars:
    bootstrap_tcp_spr: "{{ lookup('file', playbook_dir + '/../artifacts/raw/1/tcp-spr.txt') | trim }}"
  tasks:
    - name: Run RS node
      ansible.builtin.import_role:
        name: storage_node
        tasks_from: run_rs

- name: "RS Phase 3 — Preload content (book + 200MB random file)"
  hosts: rs_nodes
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Preload
      ansible.builtin.import_role:
        name: storage_node
        tasks_from: preload
