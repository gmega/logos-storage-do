---
# Installs Nix and builds the Logos toolchain + storage module on a node.
# These builds compile Nim and can take a while, so the nix steps run async.

- name: Wait for SSH to come up
  ansible.builtin.wait_for_connection:
    timeout: 300

- name: Gather facts
  ansible.builtin.setup:

- name: Install OS prerequisites
  ansible.builtin.apt:
    name:
      - curl
      - git
      - jq
      - xz-utils
      - ca-certificates
      - python3
      - acl
      - sudo
    update_cache: true
    cache_valid_time: 3600

- name: Create Logos directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ logos_home }}"
    - "{{ logos_build }}"
    - "{{ logos_modules }}"
    - "{{ logos_data_dir }}"
    - "{{ logos_config_dir }}"

- name: Check whether Nix is installed
  ansible.builtin.stat:
    path: "{{ nix_bin }}"
  register: nix_stat

- name: Install Nix (Determinate Systems installer, flakes enabled)
  ansible.builtin.shell: >
    curl --proto '=https' --tlsv1.2 -sSf -L https://install.determinate.systems/nix
    | sh -s -- install linux --no-confirm --init systemd
  args:
    creates: "{{ nix_bin }}"
  when: not nix_stat.stat.exists

- name: Ensure nix-daemon is running
  ansible.builtin.systemd:
    name: nix-daemon
    state: started
    enabled: true

- name: Build the Logos Core CLI (provides logoscore)
  ansible.builtin.command: >
    {{ nix_bin }} {{ nix_flags }}
    build github:logos-co/logos-logoscore-cli/{{ logos_cli_ref }}
    --out-link {{ logos_build }}/logos
  args:
    creates: "{{ logos_bin }}"
  async: "{{ nix_build_timeout }}"
  poll: "{{ nix_build_poll }}"

- name: Build the Logos Package Manager (provides lgpm)
  ansible.builtin.command: >
    {{ nix_bin }} {{ nix_flags }}
    build github:logos-co/logos-package-manager/{{ logos_pkgmgr_ref }}#cli
    --out-link {{ logos_build }}/package-manager
  args:
    creates: "{{ lgpm_bin }}"
  async: "{{ nix_build_timeout }}"
  poll: "{{ nix_build_poll }}"

- name: Build the Logos Storage Module
  ansible.builtin.command: >
    {{ nix_bin }} {{ nix_flags }}
    build github:logos-co/logos-storage-module/{{ storage_module_ref }}#lgx
    --override-input logos-storage
    git+https://github.com/logos-storage/logos-storage-nim?ref={{ libstorage_ref }}&submodules=1
    --refresh --print-out-paths
    --out-link {{ logos_build }}/storage-module
  async: "{{ nix_build_timeout }}"
  poll: "{{ nix_build_poll }}"
  register: storage_module_build
  changed_when: false

# Compare the actual Nix output, so changing either ref (or advancing a branch)
# replaces the installed module. A directory-exists guard would skip upgrades.
- name: Read the previously installed module build
  ansible.builtin.command: "cat {{ logos_home }}/.storage-module-build"
  register: installed_module_build
  failed_when: false
  changed_when: false

- name: Check the installed module
  ansible.builtin.stat:
    path: "{{ logos_modules }}/storage_module"
  register: installed_module

- name: Determine whether the module needs installing
  ansible.builtin.set_fact:
    storage_module_changed: >-
      {{ not installed_module.stat.exists or
         (installed_module_build.stdout | trim) != (storage_module_build.stdout | trim) }}

- name: Gather service state before replacing the module
  ansible.builtin.service_facts:
  when: storage_module_changed

- name: Stop the daemon before replacing its loaded libraries
  ansible.builtin.systemd:
    name: logoscore
    state: stopped
  when:
    - storage_module_changed
    - "'logoscore.service' in ansible_facts.services"

- name: Install the Storage Module into the modules directory
  ansible.builtin.command: >
    {{ lgpm_bin }} --modules-dir {{ logos_modules }}
    install --dir {{ logos_build }}/storage-module
  when: storage_module_changed
  register: lgpm_install

- name: Record the installed module build
  ansible.builtin.copy:
    content: "{{ storage_module_build.stdout | trim }}\n"
    dest: "{{ logos_home }}/.storage-module-build"
    mode: "0644"
  when: storage_module_changed
