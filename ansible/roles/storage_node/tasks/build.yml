---
- name: Require a pinned catalog release
  ansible.builtin.assert:
    that:
      - deployment_version is defined
      - module_url is defined
      - module_sha256 is defined

- name: Wait for SSH
  ansible.builtin.wait_for_connection:
    timeout: 300

- name: Gather facts
  ansible.builtin.setup:

- name: Require the catalog platform selected by the controller
  ansible.builtin.assert:
    that: ansible_architecture == 'x86_64'

- name: Install runtime prerequisites
  ansible.builtin.apt:
    name: [curl, jq, ca-certificates, python3, acl, sudo]
    update_cache: true
    cache_valid_time: 3600

- name: Create runtime directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ logos_home }}"
    - "{{ logos_home }}/logosctl-{{ logosctl_version }}"
    - "{{ logos_data_dir }}"
    - "{{ logos_config_dir }}"

- name: Download portable logosctl
  ansible.builtin.get_url:
    url: "https://github.com/logos-co/logos-logoscore-cli/releases/download/{{ logosctl_version }}/logosctl-x86_64-linux.tar.gz"
    dest: "{{ logos_home }}/logosctl-{{ logosctl_version }}.tar.gz"
    checksum: "sha256:{{ logosctl_sha256 }}"
    mode: "0644"

- name: Unpack portable CLI
  ansible.builtin.unarchive:
    src: "{{ logos_home }}/logosctl-{{ logosctl_version }}.tar.gz"
    dest: "{{ logos_home }}/logosctl-{{ logosctl_version }}"
    remote_src: true
    creates: "{{ logos_home }}/logosctl-{{ logosctl_version }}/logosctl-x86_64.AppImage"

- name: Extract AppImage so no FUSE is needed
  ansible.builtin.command: ./logosctl-x86_64.AppImage --appimage-extract
  args:
    chdir: "{{ logos_home }}/logosctl-{{ logosctl_version }}"
    creates: "{{ logos_bin }}"

# logosctl 0.3.2 eagerly loads its bundled downloader and storage module.
# Keep both outside its scan path: downloads are performed by Ansible and
# package_manager installs the verified local LGX without package_downloader.
- name: Preserve bundled modules outside the runtime scan path
  ansible.builtin.command:
    argv:
      - mv
      - "{{ logos_home }}/logosctl-{{ logosctl_version }}/squashfs-root/usr/modules-pkg/{{ item.name }}"
      - "{{ logos_home }}/logosctl-{{ logosctl_version }}/{{ item.backup }}"
  args:
    creates: "{{ logos_home }}/logosctl-{{ logosctl_version }}/{{ item.backup }}"
  loop:
    - {name: storage_module, backup: bundled-storage-module}
    - {name: package_downloader, backup: bundled-package-downloader}

- name: Download exact catalog module and verify its digest
  ansible.builtin.get_url:
    url: "{{ module_url }}"
    dest: "{{ logos_home }}/storage-{{ deployment_version }}.lgx"
    checksum: "sha256:{{ module_sha256 }}"
    mode: "0644"

- name: Gather existing services
  ansible.builtin.service_facts:

- name: Stop existing runtime before replacing the module
  ansible.builtin.systemd:
    name: logoscore
    state: stopped
  when: "'logoscore.service' in ansible_facts.services"

- name: Install the module using a temporary package-management daemon
  block:
    - name: Start package-management daemon
      ansible.builtin.command: "{{ logos_bin }} --config-dir={{ logos_config_dir }} daemon start --detach"
    - name: Install the verified precompiled package
      ansible.builtin.command: "{{ logos_bin }} --config-dir={{ logos_config_dir }} install {{ logos_home }}/storage-{{ deployment_version }}.lgx -y"
  always:
    - name: Stop temporary daemon
      ansible.builtin.command: "{{ logos_bin }} --config-dir={{ logos_config_dir }} daemon stop"

- name: Record installed catalog version
  ansible.builtin.copy:
    content: "{{ deployment_version }}\n"
    dest: "{{ logos_home }}/.storage-module-version"
    mode: "0644"

- name: Expose logosctl for operators
  ansible.builtin.file:
    src: "{{ logos_bin }}"
    dest: /usr/local/bin/logosctl
    state: link
