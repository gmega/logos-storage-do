---
# Configures and starts a Regular Storage (RS) node: it USES the mix network
# (mix-pool + dht-mix-proxy) to anonymize its queries, rather than relaying it.
# Expects these play vars (sourced from the controller's artifacts/):
#   bootstrap_udp_spr : node 1's UDP SPR
#   dht_mix_proxy     : list of the MP nodes' TCP SPRs

- name: Copy mix-pool.json to the node
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../artifacts/mix-pool.json"
    dest: "{{ mix_pool_file }}"
    mode: "0644"

- name: Render RS node config.json
  ansible.builtin.template:
    src: config_rs.json.j2
    dest: "{{ logos_config_file }}"
    mode: "0644"
  register: config_render

- name: Install logoscore systemd unit
  ansible.builtin.template:
    src: logoscore.service.j2
    dest: /etc/systemd/system/logoscore.service
    mode: "0644"
  register: unit_render

- name: Reload systemd if unit changed
  ansible.builtin.systemd:
    daemon_reload: true
  when: unit_render.changed

- name: Enable and (re)start the logoscore daemon
  ansible.builtin.systemd:
    name: logoscore
    state: "{{ 'restarted' if (unit_render.changed or config_render.changed) else 'started' }}"
    enabled: true

- name: Install node-init script
  ansible.builtin.template:
    src: node-init.sh.j2
    dest: "{{ logos_home }}/node-init.sh"
    mode: "0755"

- name: Load, start and wait for the storage node to announce an SPR
  ansible.builtin.command: "{{ logos_home }}/node-init.sh"
  args:
    creates: "{{ logos_home }}/.node-initialized"
