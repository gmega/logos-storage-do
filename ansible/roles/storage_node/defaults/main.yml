---
# Filesystem layout on each node.
logos_home: /opt/logos
logos_build: "{{ logos_home }}/build"
logos_modules: "{{ logos_home }}/modules"
logos_bin: "{{ logos_build }}/logos/bin/logoscore"
lgpm_bin: "{{ logos_build }}/package-manager/bin/lgpm"
mix_helper: "{{ logos_home }}/mix_helper.py"

logos_config_dir: /var/lib/logoscore
logos_config_file: "{{ logos_home }}/config.json"
logos_data_dir: /var/logos-storage-data
logos_log: /var/log/logoscore.log

# Nix (Determinate Systems installer puts nix here, with flakes enabled).
nix_bin: /nix/var/nix/profiles/default/bin/nix
# Limit parallel builds and compiler jobs to avoid exhausting the nodes' 16 GB RAM.
nix_flags: --extra-experimental-features "nix-command flakes" --max-jobs 1 --cores 2
# Max seconds a single Nix build may run before Ansible gives up. Cold Nim/
# libp2p compilation is slow, so this is deliberately generous (4 hours).
nix_build_timeout: 14400
nix_build_poll: 30

# Component versions. libstorage_ref accepts a branch or a full tag ref.
logos_cli_ref: master
logos_pkgmgr_ref: master
storage_module_ref: v2.1.3
libstorage_ref: feat/mix-transport

# Network ports (must match the Terraform firewall rules).
listen_port: 8080

# Readiness predicate: the node is only usable once it has announced a discovery
# record, i.e. `call storage_module debug` returns a non-null .result.value.spr.
# (A successful debug call alone is not enough; the SPR is null for a moment
# after start while discovery spins up.) These bound the wait at retries*delay
# seconds (15 * 2 = 30s).
spr_ready_retries: 15
spr_ready_delay: 2

# --- Regular Storage (RS) node extras ---
# Local mix-pool.json copied onto the node and referenced by the RS config.
mix_pool_file: "{{ logos_home }}/mix-pool.json"
# Content preloaded onto RS nodes.
book_url: "https://logos.co/book/farewell-to-westphalia-foss-edition.pdf"
book_file: "{{ logos_home }}/farewell-to-westphalia-foss-edition.pdf"
random_file: "{{ logos_home }}/random-200mb.bin"
random_file_mb: 200
# uploadUrl buffer size (required positional arg; missing it crashes the node).
upload_buffer: 65536
