---
# Captures the node's UDP SPR and stores it as the `udp_spr` host fact.
# Used on the bootstrap node so follower nodes can bootstrap off it.
- name: Capture storage module debug output (for UDP SPR)
  ansible.builtin.command: "{{ logos_bin }} --config-dir={{ logos_config_dir }} call storage_module debug"
  register: spr_debug
  changed_when: false

- name: Set udp_spr fact
  ansible.builtin.set_fact:
    udp_spr: "{{ (spr_debug.stdout | from_json).result.value.spr }}"

- name: Show bootstrap UDP SPR
  ansible.builtin.debug:
    msg: "Bootstrap UDP SPR: {{ udp_spr }}"
