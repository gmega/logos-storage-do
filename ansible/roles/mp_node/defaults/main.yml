---
# Filesystem layout on each node.
logos_home: /opt/logos
logos_build: "{{ logos_home }}/build"
logos_modules: "{{ logos_home }}/modules"
logos_bin: "{{ logos_build }}/logos/bin/logoscore"
lgpm_bin: "{{ logos_build }}/package-manager/bin/lgpm"
mix_helper: "{{ logos_home }}/mix_helper.py"

logos_config_dir: /var/lib/logoscore
logos_config_file: "{{ logos_home }}/config.json"
logos_data_dir: /var/logos-storage-data
logos_log: /var/log/logoscore.log

# Nix (Determinate Systems installer puts nix here, with flakes enabled).
nix_bin: /nix/var/nix/profiles/default/bin/nix
nix_flags: --extra-experimental-features "nix-command flakes"
# Max seconds a single Nix build may run before Ansible gives up. Cold Nim/
# libp2p compilation is slow, so this is deliberately generous (4 hours).
nix_build_timeout: 14400
nix_build_poll: 30

# Component versions (from infra-logos#25 / logos-storage-runner).
logos_cli_ref: master
logos_pkgmgr_ref: master
storage_module_ref: v1.2.0
libstorage_ref: refs/tags/v0.4.0-rc4

# Network ports (must match the Terraform firewall rules).
listen_port: 8080
disc_port: 8090

# Readiness log line emitted once the storage node is up.
ready_marker: "Started Storage node"
