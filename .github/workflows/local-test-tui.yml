name: Build devnet TUI

on:
  workflow_dispatch:
  push:
    paths:
      - 'local-test/**'
      - '.github/workflows/local-test-tui.yml'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
          - runner: macos-26
            platform: macos-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential jq libncurses-dev
      - name: Build native TUI and installer
        run: local-test/build.sh
      - name: Exercise macOS installer and node controls
        if: runner.os == 'macOS'
        timeout-minutes: 8
        run: |
          export LOGOS_DEVNET_HOME="$RUNNER_TEMP/portal-node"
          cat artifacts/local-test/install.sh | /bin/bash
          python3 local-test/smoke-macos.py "$LOGOS_DEVNET_HOME"
          # A republished module may have the same version and a different digest.
          cd "$LOGOS_DEVNET_HOME"
          cp installed expected-metadata
          cp config.json expected-config
          jq '.module_sha256 = ("0" * 64)' expected-metadata > installed
          touch session/modules/storage_module/old-package-file
          bash "$GITHUB_WORKSPACE/artifacts/local-test/install.sh"
          test ! -e session/modules/storage_module/old-package-file
          cmp installed expected-metadata
          jq -e --slurpfile expected expected-config '. == $expected[0]' config.json
      - name: Upload downloadable bundle
        uses: actions/upload-artifact@v4
        with:
          name: logos-devnet-${{ matrix.platform }}
          path: artifacts/local-test/logos-devnet-${{ matrix.platform }}.tar.gz
          if-no-files-found: error
          compression-level: 0

  # Produce the downloadable Mac artifact even during native runner shortages.
  cross-build-macos:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install cross-build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 nix-bin jq
      - name: Build for Apple Silicon with the macOS 14.4 SDK
        run: |
          sdk=/nix/store/c3xfmn0gi4zss7yzgh2k969xcjjyv5p0-macOS-SDK-14.4
          sudo nix --extra-experimental-features nix-command copy --from https://cache.nixos.org "$sdk"
          export PATH="/usr/lib/llvm-18/bin:$PATH"
          local-test/build.sh --macos-sdk "$sdk"
          file artifacts/local-test/logos-devnet | grep 'Mach-O 64-bit arm64'
      - uses: actions/upload-artifact@v4
        with:
          name: logos-devnet-macos-arm64-cross
          path: artifacts/local-test/logos-devnet-macos-arm64.tar.gz
          if-no-files-found: error
          compression-level: 0
